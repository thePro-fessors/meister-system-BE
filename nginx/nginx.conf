# ==============================================================================
# Nginx Reverse Proxy Configuration (Next.js + FastAPI Single Server Architecture)
# ==============================================================================

# 1. HTTP(80) 서버 블록: 헬스체크 처리 및 HTTPS(443) 강제 리다이렉트
server {
    listen 80;
    server_name _;
    charset utf-8;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location /health {
        set $be_target "http://backend:8000";
        proxy_pass $be_target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS(443) TLS 서버 블록
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    charset utf-8;

    # TLS 인증서 및 암호화 프로토콜 설정
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS 보안 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker 내장 DNS resolver 설정 (컨테이너 재기동 시 IP 변경 자동 감지 및 502 방지)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 1. 전역 업로드 용량 제한 (백엔드 50MB 증빙자료 업로드 정책과 일치)
    client_max_body_size 50M;

    # 2. 성능 최적화: Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # 3. 기본 프록시 헤더 설정 (백엔드 is_trusted_proxy IP 스푸핑 방어 연동)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # 클라이언트가 임의로 주입한 CF-Connecting-IP 헤더를 제거하여 IP 스푸핑 차단
    proxy_set_header CF-Connecting-IP "";

    # 4. 백엔드 시스템 헬스체크
    location /health {
        set $be_target "http://backend:8000";
        proxy_pass $be_target;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # 4-1. 백엔드 Swagger / ReDoc 문서 라우팅
    location ~ ^/(docs|redoc|openapi.json) {
        set $be_target "http://backend:8000";
        proxy_pass $be_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # 5. 백엔드 REST API 라우팅 (/api/*)
    location /api/ {
        set $be_target "http://backend:8000";
        proxy_pass $be_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 대용량 파일 업로드 및 AI 응답 지연 타임아웃
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 6. 증빙자료 다운로드 라우팅 (/uploads/* - 백엔드 RBAC 및 티켓 검증 통과)
    location /uploads/ {
        set $be_target "http://backend:8000";
        proxy_pass $be_target;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    # 7. 프론트엔드 라우팅 (Next.js SSR, Page Routes, 정적 번들)
    location / {
        set $fe_target "http://frontend:3000";
        proxy_pass $fe_target;
        proxy_http_version 1.1;

        # Next.js 웹소켓(HMR 등) 및 실시간 양방향 통신 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 프론트엔드 미기동 상태이거나 게이트웨이 타임아웃 시 사용자 안내 페이지 서빙
        proxy_intercept_errors on;
        error_page 502 503 504 = @frontend_down;
    }

    location @frontend_down {
        charset utf-8;
        default_type "text/html; charset=utf-8";
        return 502 '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Meister System Loading</title><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background:#f8fafc;color:#334155;}div{text-align:center;padding:2rem;background:#fff;border-radius:12px;box-shadow:0 4px 6px -1px rgb(0 0 0/0.1);}</style></head><body><div><h2>🏫 마이스터 역량인증 시스템</h2><p>백엔드 API는 정상 구동 중입니다. 프론트엔드 컨테이너 기동을 대기하고 있습니다.</p><p><small>Backend Status: <a href="/health">/health</a> | API: <a href="/docs">/docs</a></small></p></div></body></html>';
    }
}
